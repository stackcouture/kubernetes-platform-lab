apiVersion: v1 
kind: Pod 
metadata:
  name: multi-container-pod 
  labels:
    app: multi-container
spec:
  containers:
  - name: app
    image: nginx:1.27-alpine
    ports:
    - containerPort: 80

    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx 

  - name: log-sidecar
    image: busybox:1.36 
    command:
    - sh
    - -c
    - |
      echo "Log sidecar started"
          while true; do
            if [ -f /var/log/nginx/access.log ]; then
              tail -n 5 /var/log/nginx/access.log
            fi
            sleep 10
          done

    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx

  volumes:
  - name: shared-logs
    emptyDir: {}