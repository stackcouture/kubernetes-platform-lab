apiVersion: v1
kind: Pod 
metadata:
  name: probe-demo
  labels:
    app: probe-demo
    env: dev
spec:
  containers:
  - name: nginx-container
    image: nginx:1.27-alpine

    ports:
    - containerPort: 80 

    startupProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 12

    readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
        successThreshold: 1

    livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3